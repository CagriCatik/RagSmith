[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ragsmith"
version = "0.1.0"
description = "PDF to Markdown to RAG pipeline with CLI and PyQt6 GUI"
authors = [{ name = "RagSmith" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
markitdown = ["markitdown"]
pymupdf4llm = ["pymupdf4llm", "pymupdf-layout"]
docling = ["docling", "torch"]
full = ["markitdown", "pymupdf4llm", "pymupdf-layout", "docling", "torch"]
gui = ["PyQt6"]

[project.scripts]
ragsmith-cli = "src.cli.main:main"
ragsmith-gui = "src.ui.application:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["ragsmith*",]
